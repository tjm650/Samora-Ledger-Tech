services:
  - type: web
    name: samora-ledger-analytics
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: SUPABASE_URL
        value: https://gxctcjhxajjhpaayiofq.supabase.co
      - key: API_KEY
        generateValue: true
      - key: DEMO_PUBLIC_READS
        value: "true"
      - key: API_CORS_ORIGINS
        value: https://samora-ledger-tech-tinotendajmuyambo.vercel.app
